name: awva
description: "awva: the awva sound engines as a standalone instrument."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/logo/awva.png
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf
